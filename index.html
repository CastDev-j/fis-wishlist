<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIS Wishlist</title>
  <link rel="stylesheet" href="global.css" />
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>Bienvenido a tu wishlist</h1>
      <p class="subtitle">Anota las cosas que deseas.</p>
    </header>
    <button id="add-btn" type="button">Agregar deseo</button>
    <section class="list-section" aria-label="Lista de deseos">
      <h2>Tus deseos</h2>
      <p id="empty-msg">Aún no has agregado deseos.</p>
      <ul id="wishlist"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
